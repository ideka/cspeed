# N64Recomp configuration for California Speed (USA)
# Usage (from repo root):  N64Recomp\build\N64Recomp.exe cspeed.us.toml

[input]
entrypoint = 0x80000400
rom_file_path = "California Speed (USA).z64"
symbols_file_path = "cspeed.us.syms.toml"
output_func_path = "RecompiledFuncs"
functions_per_output_file = 50
# trace_mode = true   # debugging only

[patches]
# Functions to stub out (compile to no-ops) / skip entirely. libultra functions that
# N64Recomp knows by name (see N64Recomp/src/symbol_lists.cpp) are handled automatically.
stubs = []
# Dead code using ll/sc, sync, or shared asm tails is classified as data by tools/funcbounds.py
# and never reaches the symbol file, so nothing needs ignoring yet.
# The Controller Pak is emulated below libultra: the game's own osPfs* filesystem code is recompiled
# (renamed game_* via symbols/recomp_names.json) and only these Serial Interface entry points are
# implemented natively, in src/game/controller_pak.cpp.
ignored = ["cspeed_osContRamRead", "cspeed_osContRamWrite", "cspeed_osPfsGetStatus", "cspeed_osPfsIsPlug",
# src/game/game_fixes.cpp
           "cspeed_romLockTryAcquire"]

# The idle thread (0x80000518) ends in `j .` at 0x800005C0. Spinning forever would starve the
# runtime's cooperative scheduler ("No threads left to run!"), so pause the thread instead.
[[patches.hook]]
func = "idle"
text = "pause_self(rdram);"
before_vram = 0x800005C0

# Busy-wait loops polling the halfword at 0x80001400 (cleared by the scheduler thread when the
# RSP/RDP task finishes). Yield inside them so the other threads can run.
[[patches.hook]]
func = "func_8008C024"
text = "yield_self(rdram);"
before_vram = 0x8008C05C

[[patches.hook]]
func = "func_8008C16C"
text = "yield_self(rdram);"
before_vram = 0x8008C184

[[patches.hook]]
func = "func_8008C444"
text = "yield_self(rdram);"
before_vram = 0x8008C498


# Emulated paks are a Controller Pak and a Rumble Pak at once: after the game's pak probe handles a
# channel, also enable rumble for it (see src/game/controller_pak.cpp).
[[patches.hook]]
func = "func_8005D1C8"
text = "{ void cspeed_after_pak_probe(uint8_t*, recomp_context*); cspeed_after_pak_probe(rdram, ctx); }"
before_vram = 0x8005DAF0

# Before a race the game asks for Rumble Paks unless each player's "Rumble Pak inserted" byte
# (0x8012FD81 + player) is set. The emulated pak takes the Controller Pak path of the probe, which
# clears that byte, and setting it would make the save screens report "RUMBLE PAK" instead of the
# Controller Pak. So only this check is told the Rumble Pak is there (the loaded byte is in $v0).
[[patches.hook]]
func = "func_800A9B54"
text = "ctx->r2 = 1;"
before_vram = 0x800A9BAC

[[patches.hook]]
func = "func_800A9B54"
text = "ctx->r2 = 1;"
before_vram = 0x800A9BC8


# Widescreen: open the 3D camera's scissor to the full width when "Expand" is selected, so RT64
# widens the scene (see src/game/graphics.cpp).
[[patches.hook]]
func = "func_800CF0B4"
text = "{ void cspeed_widescreen_camera_scissor(uint8_t*, recomp_context*); cspeed_widescreen_camera_scissor(rdram, ctx); }"
before_vram = 0x800CF338

# Enable RT64's extended GBI for every graphics task: point the task at a small prologue display list
# (gEXEnable + branch to the game's list). See src/game/graphics.cpp.
[[patches.hook]]
func = "func_80055168"
text = "{ void cspeed_gfx_task_prologue(uint8_t*, recomp_context*); cspeed_gfx_task_prologue(rdram, ctx); }"
before_vram = 0x800551F8

# HUD placement: anchor race HUD sprites and fill rectangles to the screen side they sit on, and give
# the 2D display list a full-width scissor (see src/game/graphics.cpp).
[[patches.hook]]
func = "func_8005CCC4"
text = "{ void cspeed_hud_sprite_align(uint8_t*, recomp_context*); cspeed_hud_sprite_align(rdram, ctx); }"
before_vram = 0x8005CCC4

[[patches.hook]]
func = "func_8005C718"
text = "{ void cspeed_hud_sprite_align(uint8_t*, recomp_context*); cspeed_hud_sprite_align(rdram, ctx); }"
before_vram = 0x8005C718

[[patches.hook]]
func = "func_8005A0D8"
text = "{ void cspeed_hud_begin(uint8_t*, recomp_context*); cspeed_hud_begin(rdram, ctx); }"
before_vram = 0x8005A21C

# Widescreen races, at task submission: drop the black side-border fill rectangles (two thin bars inside
# the widened view) and anchor the speedometer needle to the right like the rest of its dial (see
# src/game/graphics.cpp).
[[patches.hook]]
func = "func_80055168"
text = "{ void cspeed_widescreen_frame_submit(uint8_t*, recomp_context*); cspeed_widescreen_frame_submit(rdram, ctx); }"
before_vram = 0x80055380

# Frame rate: the scheduler only swaps buffers once at least 2 retraces have passed since the last
# swap (when a frame's task completes, otherwise later from the retrace handler), capping the game at
# 30 FPS. Both checks are recomputed to allow 60 FPS in races (see src/game/framerate.cpp).
[[patches.hook]]
func = "__scTaskComplete"
text = "{ int cspeed_swap_too_soon(uint8_t*, recomp_context*); ctx->r2 = cspeed_swap_too_soon(rdram, ctx); }"
before_vram = 0x80001008

[[patches.hook]]
func = "__scHandleRetrace"
text = "{ int cspeed_swap_too_soon(uint8_t*, recomp_context*); ctx->r2 = cspeed_swap_too_soon(rdram, ctx); }"
before_vram = 0x80000C60

# Audio sample rate: the audio setup asks osAiSetFrequency for 22050 Hz and sizes everything from the
# result; ask for the rate from the sound options instead (see src/game/audio.cpp).
[[patches.hook]]
func = "func_80056A78"
text = "{ void cspeed_set_audio_rate(uint8_t*, recomp_context*); cspeed_set_audio_rate(rdram, ctx); }"
before_vram = 0x80056C08

[[patches.hook]]
func = "func_80056A78"
text = "{ void cspeed_after_audio_init(uint8_t*, recomp_context*); cspeed_after_audio_init(rdram, ctx); }"
before_vram = 0x80056FA8

